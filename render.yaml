services:
  - type: web
    name: suvane-research-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://suvane.org,https://www.suvane.org,https://suvane-research.oliviaralph89.chatgpt.site
      - key: API_DOCS_ENABLED
        value: "false"
      - key: MAX_REQUEST_BODY_BYTES
        value: "8192"
